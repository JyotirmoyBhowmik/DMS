openapi: 3.0.3
info:
  title: Notification Service API
  version: 1.0.0
  description: Multi-channel notifications routing engine API.
paths:
  /notifications/send:
    post:
      summary: Send push, SMS, or email notification
      operationId: sendNotification
      responses:
        '202':
          description: Notification queued successfully

  /api/v1/notification-templates:
    post:
      summary: Create NotificationTemplate
      operationId: createNotificationTemplate
      parameters:
        - in: header
          name: X-Idempotency-Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationTemplateRequest'
      responses:
        '201':
          description: NotificationTemplate created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplateResponse'
        '400':
          description: Invalid input or domain validation failure
        '409':
          description: Template code conflict or idempotency failure
    get:
      summary: List NotificationTemplates with pagination
      operationId: listNotificationTemplates
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
        - in: query
          name: channel
          schema:
            type: string
            enum: [EMAIL, SMS, PUSH, WHATSAPP]
        - in: query
          name: status
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, ARCHIVED]
      responses:
        '200':
          description: List of NotificationTemplates

  /api/v1/notification-templates/{id}:
    get:
      summary: Get NotificationTemplate by ID
      operationId: getNotificationTemplate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: NotificationTemplate details
        '404':
          description: NotificationTemplate not found
    put:
      summary: Update NotificationTemplate
      operationId: updateNotificationTemplate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationTemplateRequest'
      responses:
        '200':
          description: NotificationTemplate updated
        '409':
          description: Version conflict
    delete:
      summary: Delete NotificationTemplate
      operationId: deleteNotificationTemplate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: NotificationTemplate deleted successfully
        '404':
          description: NotificationTemplate not found

components:
  schemas:
    CreateNotificationTemplateRequest:
      type: object
      required:
        - code
        - name
        - channel
        - bodyTemplate
      properties:
        code:
          type: string
        name:
          type: string
        channel:
          type: string
          enum: [EMAIL, SMS, PUSH, WHATSAPP]
        subject:
          type: string
          nullable: true
        bodyTemplate:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ARCHIVED]
          default: ACTIVE
    UpdateNotificationTemplateRequest:
      type: object
      required:
        - version
      properties:
        name:
          type: string
        subject:
          type: string
          nullable: true
        bodyTemplate:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ARCHIVED]
        version:
          type: integer
          minimum: 1
    NotificationTemplateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        channel:
          type: string
          enum: [EMAIL, SMS, PUSH, WHATSAPP]
        subject:
          type: string
          nullable: true
        bodyTemplate:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ARCHIVED]
        version:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
