openapi: 3.0.3
info:
  title: Config Service API
  version: 1.0.0
  description: Multi-tenant Configuration management service for system settings, feature flags and parameters.
paths:
  /api/v1/config-entries:
    post:
      summary: Create Config Entry
      operationId: createConfigEntry
      parameters:
        - in: header
          name: X-Idempotency-Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConfigEntryRequest'
      responses:
        '201':
          description: ConfigEntry created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigEntryResponse'
        '400':
          description: Invalid input or domain validation failure
        '409':
          description: Idempotency or duplicate key conflict
    get:
      summary: List Config Entries with pagination and filters
      operationId: listConfigEntries
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
        - in: query
          name: configKey
          schema:
            type: string
        - in: query
          name: dataType
          schema:
            type: string
            enum: [STRING, NUMBER, BOOLEAN, JSON]
        - in: query
          name: status
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, DEPRECATED]
      responses:
        '200':
          description: Paginated list of ConfigEntries

  /api/v1/config-entries/{id}:
    get:
      summary: Get Config Entry details by ID
      operationId: getConfigEntry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ConfigEntry details
        '404':
          description: ConfigEntry not found
    put:
      summary: Update Config Entry value or status
      operationId: updateConfigEntry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConfigEntryRequest'
      responses:
        '200':
          description: ConfigEntry updated successfully
        '409':
          description: Optimistic locking conflict
    delete:
      summary: Delete Config Entry by ID
      operationId: deleteConfigEntry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ConfigEntry deleted successfully

  /api/v1/config-entries/key/{key}:
    get:
      summary: Get Config Entry details by Key
      operationId: getConfigEntryByKey
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ConfigEntry details
        '404':
          description: ConfigEntry not found

components:
  schemas:
    CreateConfigEntryRequest:
      type: object
      required:
        - configKey
        - configValue
      properties:
        configKey:
          type: string
        configValue:
          type: string
        dataType:
          type: string
          enum: [STRING, NUMBER, BOOLEAN, JSON]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DEPRECATED]
        isEncrypted:
          type: boolean

    UpdateConfigEntryRequest:
      type: object
      required:
        - expectedVersion
      properties:
        configValue:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DEPRECATED]
        expectedVersion:
          type: integer
          minimum: 1

    ConfigEntryResponse:
      type: object
      required:
        - id
        - tenantId
        - configKey
        - configValue
        - dataType
        - status
        - isEncrypted
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        configKey:
          type: string
        configValue:
          type: string
        dataType:
          type: string
          enum: [STRING, NUMBER, BOOLEAN, JSON]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DEPRECATED]
        isEncrypted:
          type: boolean
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
