components:
  schemas:
    CreateInvoiceRequest:
      type: object
      required:
        - distributorId
        - invoiceNumber
        - dueDate
      properties:
        distributorId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        grossAmountCents:
          type: integer
          minimum: 0
        discountAmountCents:
          type: integer
          minimum: 0
        taxAmountCents:
          type: integer
          minimum: 0
        netAmountCents:
          type: integer
          minimum: 0
        dueDate:
          type: string
          format: date
    UpdateInvoiceRequest:
      type: object
      required:
        - version
      properties:
        status:
          type: string
          enum: [DRAFT, ISSUED, PAID, CANCELLED, CREDIT_NOTE]
        version:
          type: integer
          minimum: 1
    InvoiceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        status:
          type: string
        netAmountCents:
          type: integer
        version:
          type: integer

    CreateCreditNoteRequest:
      type: object
      required:
        - distributorId
        - creditNoteNumber
        - amountCents
        - reason
      properties:
        distributorId:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        creditNoteNumber:
          type: string
        amountCents:
          type: integer
          minimum: 1
        reason:
          type: string
    UpdateCreditNoteRequest:
      type: object
      required:
        - version
      properties:
        status:
          type: string
          enum: [DRAFT, APPROVED, APPLIED, CANCELLED]
        version:
          type: integer
          minimum: 1
    CreditNoteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        creditNoteNumber:
          type: string
        status:
          type: string
        amountCents:
          type: integer
        version:
          type: integer

    CreateDebitNoteRequest:
      type: object
      required:
        - distributorId
        - debitNoteNumber
        - amountCents
        - reason
      properties:
        distributorId:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        debitNoteNumber:
          type: string
        amountCents:
          type: integer
          minimum: 1
        reason:
          type: string
    UpdateDebitNoteRequest:
      type: object
      required:
        - version
      properties:
        status:
          type: string
          enum: [DRAFT, APPROVED, APPLIED, CANCELLED]
        version:
          type: integer
          minimum: 1
    DebitNoteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        debitNoteNumber:
          type: string
        status:
          type: string
        amountCents:
          type: integer
        version:
          type: integer

    CreatePaymentRequest:
      type: object
      required:
        - distributorId
        - paymentReference
        - amountCents
      properties:
        distributorId:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        paymentReference:
          type: string
        amountCents:
          type: integer
          minimum: 1
        paymentMethod:
          type: string
    UpdatePaymentRequest:
      type: object
      required:
        - version
      properties:
        status:
          type: string
          enum: [DRAFT, PROCESSING, COMPLETED, FAILED, REFUNDED]
        version:
          type: integer
          minimum: 1
    PaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        paymentReference:
          type: string
        status:
          type: string
        amountCents:
          type: integer
        version:
          type: integer

    CreateCollectionRequest:
      type: object
      required:
        - distributorId
        - collectionReference
        - amountCents
      properties:
        distributorId:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        collectionReference:
          type: string
        amountCents:
          type: integer
          minimum: 1
        collectionMode:
          type: string
    UpdateCollectionRequest:
      type: object
      required:
        - version
      properties:
        status:
          type: string
          enum: [DRAFT, PENDING, COLLECTED, FAILED, CANCELLED]
        version:
          type: integer
          minimum: 1
    CollectionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        collectionReference:
          type: string
        status:
          type: string
        amountCents:
          type: integer
        version:
          type: integer

    CreateAgeingReportRequest:
      type: object
      required:
        - distributorId
        - asOfDate
      properties:
        distributorId:
          type: string
        asOfDate:
          type: string
          format: date
        currentBucketCents:
          type: integer
          minimum: 0
        bucket1To30Cents:
          type: integer
          minimum: 0
        bucket31To60Cents:
          type: integer
          minimum: 0
        bucket61To90Cents:
          type: integer
          minimum: 0
        bucket90PlusCents:
          type: integer
          minimum: 0
    UpdateAgeingReportRequest:
      type: object
      required:
        - version
      properties:
        status:
          type: string
          enum: [GENERATED, VERIFIED, RECONCILED, ARCHIVED]
        version:
          type: integer
          minimum: 1
    AgeingReportResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        distributorId:
          type: string
        asOfDate:
          type: string
        totalOutstandingCents:
          type: integer
        status:
          type: string
        version:
          type: integer

    CreateEInvoiceRequest:
      type: object
      required:
        - invoiceId
        - irn
      properties:
        invoiceId:
          type: string
          format: uuid
        irn:
          type: string
        qrCode:
          type: string
        acknowledgementNumber:
          type: string
        taxAmountCents:
          type: integer
          minimum: 0
        totalAmountCents:
          type: integer
          minimum: 0
    UpdateEInvoiceRequest:
      type: object
      required:
        - version
      properties:
        status:
          type: string
          enum: [PENDING, GENERATED, CANCELLED, FAILED]
        version:
          type: integer
          minimum: 1
    EInvoiceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        irn:
          type: string
        status:
          type: string
        totalAmountCents:
          type: integer
        version:
          type: integer

